<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mail Assistent</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fafafa;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1B2A4A;
    }
    .mode-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      margin-bottom: 10px;
      background: #E8F1F1;
      color: #2E8B8B;
    }
    .mail-preview {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 12px;
      color: #555;
      line-height: 1.4;
    }
    .mail-preview .from {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }
    .mail-preview .subject {
      font-weight: 600;
      color: #2E8B8B;
      margin-bottom: 6px;
    }
    label {
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 4px;
      display: block;
      color: #444;
    }
    .row { display: flex; gap: 8px; }
    .row > div { flex: 1; }
    select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 10px;
      background: #fff;
    }
    textarea {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 8px;
      padding-right: 38px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
      min-height: 60px;
      margin-bottom: 10px;
    }
    .mic-wrapper { position: relative; width: 100%; }
    .mic-btn {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 0;
      transition: all 0.15s;
    }
    .mic-btn:hover { background: #f0f0f0; }
    .mic-btn.recording {
      background: #d13438;
      border-color: #d13438;
      color: #fff;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(209,52,56,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(209,52,56,0); }
    }
    textarea:focus, select:focus {
      outline: none;
      border-color: #2E8B8B;
      box-shadow: 0 0 0 2px rgba(46,139,139,0.15);
    }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 0.15s;
    }
    .btn-primary { background: #1B2A4A; color: #fff; }
    .btn-primary:hover { background: #24365e; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .btn-success { background: #2E8B8B; color: #fff; }
    .btn-success:hover { background: #267676; }
    .btn-outline { background: #fff; color: #333; border: 1px solid #ccc; }
    .btn-outline:hover { background: #f0f0f0; }
    .quick-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .quick-row .btn { margin-bottom: 0; font-size: 12px; padding: 8px; }
    #suggestions { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .chip {
      border: 1px solid #2E8B8B;
      color: #1B2A4A;
      background: #fff;
      border-radius: 14px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      text-align: left;
    }
    .chip:hover { background: #E8F1F1; }
    .divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 4px 0 12px;
    }
    .section-hint {
      font-size: 11px;
      color: #888;
      margin: -4px 0 8px;
    }
    .result-box {
      flex: 1;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
      overflow-y: auto;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11pt;
      color: #000000;
      line-height: 1.5;
      white-space: pre-wrap;
      display: none;
    }
    .result-box.visible { display: block; }
    .result-box[contenteditable="true"]:focus { outline: none; border-color: #2E8B8B; }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 11px;
      color: #2E8B8B;
      margin-bottom: 6px;
      display: none;
    }
    .status.visible { display: block; }
    .status.error { color: #d13438; }
    .actions { display: none; }
    .actions.visible { display: flex; gap: 6px; }
    .actions .btn { flex: 1; }
    .settings-panel {
      display: none;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .settings-panel.visible { display: block; }
    .settings-panel input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h2>Mail Assistent</h2>
  <span class="mode-badge" id="modeBadge">Lade...</span>

  <div class="settings-panel" id="settingsPanel">
    <label for="apiKey">Claude API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-..."/>
    <label for="signature" style="margin-top:8px;">Signatur (wird beim Antworten angehaengt)</label>
    <textarea id="signature" placeholder="Rafael Groener&#10;Vice President&#10;LSJ Advisory GmbH&#10;..." style="width:100%; min-height:70px; padding:6px 8px; border:1px solid #ccc; border-radius:4px; font-size:12px; font-family:inherit; margin-bottom:8px;"></textarea>
    <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
  </div>
  <button class="btn btn-outline" onclick="toggleSettings()" style="margin-bottom:10px; font-size:12px;">Einstellungen (Key &amp; Signatur)</button>

  <div class="mail-preview" id="mailPreview">
    <div class="from" id="mailFrom">Lade Mail...</div>
    <div class="subject" id="mailSubject"></div>
    <div id="mailBody"></div>
  </div>

  <!-- Schnellantworten (nur beim Antworten sinnvoll) -->
  <div id="quickSection">
    <label>Kurzantwort (Eingangsbestätigung, ~24h)</label>
    <div class="quick-row">
      <button class="btn btn-outline" onclick="quickReply('de')">Kurzantwort DE</button>
      <button class="btn btn-outline" onclick="quickReply('en')">Kurzantwort EN</button>
    </div>
    <label style="margin-top:10px;">Antwortvorschläge (kontextbezogen, 2-3 Optionen)</label>
    <button class="btn btn-outline" id="suggestBtn" onclick="suggestReplies()" style="font-size:12px; padding:8px;">Vorschläge laden</button>
    <div id="suggestions"></div>
  </div>

  <hr class="divider"/>

  <div class="row">
    <div>
      <label for="lang">Sprache</label>
      <select id="lang">
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
      </select>
    </div>
    <div>
      <label for="tone">Tonfall</label>
      <select id="tone">
        <option value="formell">Formell (Sie)</option>
        <option value="locker">Locker & direkt (Du)</option>
        <option value="kurz">Ultra-kurz</option>
      </select>
    </div>
  </div>

  <label for="keywords" id="keywordsLabel">Stichworte</label>
  <div class="mic-wrapper">
    <textarea id="keywords" placeholder="z.B. zusagen, naechste Woche Dienstag, freue mich (oder Mikro klicken zum Diktieren)"></textarea>
    <button class="mic-btn" id="micBtn" type="button" onclick="toggleMic()" title="Diktieren">&#127908;</button>
  </div>

  <button class="btn btn-primary" id="generateBtn" onclick="generateReply()">
    Antwort generieren
  </button>

  <div class="status" id="status"></div>

  <div class="result-box" id="resultBox" contenteditable="true"></div>

  <div class="actions" id="actions">
    <button class="btn btn-success" id="insertBtn" onclick="insertReply()">In Mail einfuegen</button>
    <button class="btn btn-outline" onclick="regenerate()">Nochmal</button>
  </div>

  <script>
    let mailData = { from: '', subject: '', body: '' };
    let recognition = null;
    let isRecording = false;
    let mode = 'read'; // 'read' = Antwort auf Mail, 'compose' = neue Mail
    let lastPreset = null; // fuer "Nochmal" bei Schnellantworten
    let lastLang = null; // Sprach-Override der letzten Generierung (Kurzantwort)
    let suggestions = []; // aktuelle Antwortvorschlaege

    Office.onReady(function(info) {
      if (info.host === Office.HostType.Outlook) {
        detectMode();
        setupSpeechRecognition();
      }
    });

    function detectMode() {
      const item = Office.context.mailbox.item;
      // In Compose-Modus ist item.subject ein Objekt mit getAsync; im Lese-Modus ein String.
      const isCompose = item && item.subject && typeof item.subject.getAsync === 'function';
      mode = isCompose ? 'compose' : 'read';

      if (mode === 'read') {
        document.getElementById('modeBadge').textContent = 'Antwort auf Mail';
        document.getElementById('mailPreview').style.display = '';
        document.getElementById('quickSection').style.display = '';
        document.getElementById('keywordsLabel').textContent = 'Stichworte fuer die Antwort';
        loadMail();
      } else {
        document.getElementById('modeBadge').textContent = 'Neue Mail aus Stichworten';
        document.getElementById('mailPreview').style.display = 'none';
        // Schnellantworten ergeben nur beim Antworten Sinn
        document.getElementById('quickSection').style.display = 'none';
        document.getElementById('keywordsLabel').textContent = 'Worum geht es? (Stichworte)';
        document.getElementById('keywords').placeholder = 'z.B. Termin vorschlagen, naechste Woche, kurzes Update Projekt X';
        document.getElementById('generateBtn').textContent = 'Mail verfassen';
      }
    }

    function setupSpeechRecognition() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        const btn = document.getElementById('micBtn');
        if (btn) { btn.disabled = true; btn.title = 'Spracheingabe nicht unterstuetzt'; btn.style.opacity = '0.4'; }
        return;
      }
      recognition = new SpeechRec();
      recognition.lang = 'de-DE';
      recognition.continuous = true;
      recognition.interimResults = true;
      let finalTranscript = '';
      let baseText = '';
      recognition.onstart = function() {
        baseText = document.getElementById('keywords').value;
        if (baseText && !baseText.endsWith(' ')) baseText += ' ';
        finalTranscript = '';
      };
      recognition.onresult = function(event) {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) { finalTranscript += transcript; }
          else { interim += transcript; }
        }
        document.getElementById('keywords').value = baseText + finalTranscript + interim;
      };
      recognition.onerror = function(event) { showStatus('Spracheingabe Fehler: ' + event.error, true); stopMic(); };
      recognition.onend = function() {
        if (isRecording) { try { recognition.start(); } catch (e) { stopMic(); } }
      };
    }

    function toggleMic() {
      if (!recognition) return;
      if (isRecording) { stopMic(); } else { startMic(); }
    }
    function startMic() {
      try {
        recognition.lang = document.getElementById('lang').value === 'en' ? 'en-US' : 'de-DE';
        recognition.start();
        isRecording = true;
        document.getElementById('micBtn').classList.add('recording');
        showStatus('Aufnahme laeuft — sprich los, Mikro klicken zum Stoppen.', false);
      } catch (e) { showStatus('Mikro konnte nicht starten: ' + e.message, true); }
    }
    function stopMic() {
      isRecording = false;
      document.getElementById('micBtn').classList.remove('recording');
      try { recognition.stop(); } catch (e) {}
      hideStatus();
    }

    function loadMail() {
      try {
        const item = Office.context.mailbox.item;
        // Mails haben .from, Termine haben .organizer
        const sender = item.from || item.organizer;
        mailData.from = sender ? sender.displayName : 'Unbekannt';
        mailData.subject = item.subject || '(Kein Betreff)';
        document.getElementById('mailFrom').textContent = 'Von: ' + mailData.from;
        document.getElementById('mailSubject').textContent = mailData.subject;
        item.body.getAsync(Office.CoercionType.Text, function(result) {
          if (result.status === Office.AsyncResultStatus.Succeeded) {
            mailData.body = result.value.substring(0, 2000);
            document.getElementById('mailBody').textContent =
              mailData.body.substring(0, 300) + (mailData.body.length > 300 ? '...' : '');
          }
        });
      } catch (e) {
        document.getElementById('mailFrom').textContent = 'Mail konnte nicht geladen werden';
      }
    }

    // Persistenter Speicher: Outlook RoamingSettings ueberlebt Cache-Loeschen und
    // Neustarts (serverseitig pro Postfach). localStorage ist nur Fallback.
    function getSetting(name) {
      try {
        const v = Office.context.roamingSettings.get(name);
        if (v !== undefined && v !== null) return v;
      } catch (e) {}
      return localStorage.getItem(name) || '';
    }
    function setSetting(name, value, cb) {
      try { localStorage.setItem(name, value); } catch (e) {}
      try {
        Office.context.roamingSettings.set(name, value);
        Office.context.roamingSettings.saveAsync(function() { if (cb) cb(); });
        return;
      } catch (e) {}
      if (cb) cb();
    }

    function getApiKey() {
      const key = getSetting('claude_api_key');
      if (!key) { showStatus('Bitte API Key in den Einstellungen hinterlegen.', true); toggleSettings(); return null; }
      return key;
    }
    function saveSettings() {
      const key = document.getElementById('apiKey').value.trim();
      const sig = document.getElementById('signature').value;
      if (key) { setSetting('claude_api_key', key); }
      setSetting('mail_signature', sig, function() {
        showStatus('Gespeichert!', false);
        document.getElementById('settingsPanel').classList.remove('visible');
      });
    }
    function toggleSettings() {
      const panel = document.getElementById('settingsPanel');
      panel.classList.toggle('visible');
      document.getElementById('apiKey').value = getSetting('claude_api_key');
      document.getElementById('signature').value = getSetting('mail_signature');
    }

    // Kurzantwort / Eingangsbestaetigung: per KI, damit die Anrede zum
    // Empfaenger passt. Sprache fest (Button), Ton aus Dropdown (du/Sie).
    function quickReply(lang) {
      const preset = lang === 'en'
        ? 'Write a brief acknowledgment reply: thank them for their message, say I am looking into it and will get back to them shortly (within about a day). Do not commit to anything specific.'
        : 'Schreibe eine kurze Eingangsbestaetigung: bedanke dich fuer die Nachricht, sag dass ich mir das ansehe und mich in Kuerze zurueckmelde (innerhalb von etwa einem Tag). Nichts Konkretes zusagen.';
      generateReply(preset, lang);
    }

    // Kontextbezogene Antwortvorschlaege (2-3 Chips), die alle sinnvollen
    // Ausgaenge abdecken. Sprache automatisch = Sprache der Originalmail.
    async function suggestReplies() {
      const apiKey = getApiKey();
      if (!apiKey) return;

      const tone = document.getElementById('tone').value;
      const toneMap = {
        formell: 'formal and professional',
        locker: 'casual and direct',
        kurz: 'very short and to the point'
      };
      const addressForm = {
        formell: 'If the reply is in German, use the polite "Sie" form.',
        locker: 'If the reply is in German, use the informal "du" form.',
        kurz: 'If the reply is in German, use the polite "Sie" form.'
      };
      // Name unter dem Gruss: du -> Vorname, Sie -> voller Name
      const closeName = { formell: 'Rafael Groener', locker: 'Rafael', kurz: 'Rafael Groener' };

      const sbtn = document.getElementById('suggestBtn');
      const container = document.getElementById('suggestions');
      container.innerHTML = '';
      sbtn.disabled = true;
      sbtn.innerHTML = '<span class="spinner"></span>Lade...';
      hideStatus();

      const prompt = 'You are an email assistant for Rafael Groener at LSJ Advisory (an M&A boutique). '
        + 'Read the email below and propose 2-3 SHORT reply options that Rafael could pick with one click.\n'
        + 'Rules:\n'
        + '- Reply in the SAME LANGUAGE as the original email (auto-detect it).\n'
        + '- Cover the DISTINCT plausible outcomes. If the sender offers several dates/times/options, create one reply per option (e.g. confirm the 28th; confirm the 31st) PLUS one decline / propose-another-time option.\n'
        + '- Tone: ' + toneMap[tone] + '. ' + addressForm[tone] + ' Use the SAME form of address CONSISTENTLY across ALL options and within each reply — NEVER mix "Sie" and "du". Do not mirror the senders form of address; follow the instructed one.\n'
        + '- Structure EVERY reply with real paragraph breaks: salutation on its own line, then a BLANK line, then the message (1-2 sentences), then a BLANK line, then the closing formula (e.g. "Viele Grüße" / "Best regards") and on the NEXT line the sign-off name. Name rule: if the reply is in ENGLISH always use "Rafael"; if in GERMAN use "' + closeName[tone] + '". In the JSON "text", a blank line is \\n\\n and a single line break is \\n.\n'
        + '- Salutation: begin each reply with a personal salutation using the sender name from the original email. English: "Dear <first name>". German ' + (tone === 'locker' ? 'du (informal): "Lieber <Vorname>" / "Liebe <Vorname>"' : 'Sie (formal): "Lieber Herr <Nachname>" / "Liebe Frau <Nachname>"') + ' — choose Herr/Frau and Lieber/Liebe by the recipient\'s likely gender.\n'
        + '- Do NOT add any contact block or company footer after the name — a signature is appended automatically.\n'
        + '- If the reply is in German, use correct umlauts ü ö ä ß and ß, NEVER ue/oe/ae/ss.\n'
        + '- Keep each option to at most 3 short sentences.\n\n'
        + 'Original email from ' + mailData.from + ':\n'
        + 'Subject: ' + mailData.subject + '\n'
        + mailData.body + '\n\n'
        + 'Return a JSON object with an "options" array of 2-3 items. Each item has "label" (a 3-5 word summary in the reply language, for the button) and "text" (the full short reply; use \\n for line breaks). Keep each "text" short so the whole JSON stays compact.';

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-5',
            max_tokens: 2000,
            output_config: {
              format: {
                type: 'json_schema',
                schema: {
                  type: 'object',
                  properties: {
                    options: {
                      type: 'array',
                      items: {
                        type: 'object',
                        properties: { label: { type: 'string' }, text: { type: 'string' } },
                        required: ['label', 'text'],
                        additionalProperties: false
                      }
                    }
                  },
                  required: ['options'],
                  additionalProperties: false
                }
              }
            },
            messages: [{ role: 'user', content: prompt }]
          })
        });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || 'API Fehler: ' + response.status);
        }
        const data = await response.json();
        let raw = (data.content[0] && data.content[0].text ? data.content[0].text : '').trim();
        raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
        let parsed;
        try {
          parsed = JSON.parse(raw);
        } catch (pe) {
          // Fallback: JSON-Objekt oder -Array aus umgebendem Text schneiden
          let s = raw.indexOf('{'), e = raw.lastIndexOf('}');
          if (s < 0) { s = raw.indexOf('['); e = raw.lastIndexOf(']'); }
          if (s >= 0 && e > s) parsed = JSON.parse(raw.substring(s, e + 1));
          else throw pe;
        }
        suggestions = Array.isArray(parsed) ? parsed : (parsed.options || []);
        renderSuggestions();
      } catch (e) {
        showStatus('Fehler bei Vorschlaegen: ' + e.message, true);
      } finally {
        sbtn.disabled = false;
        sbtn.textContent = 'Vorschläge neu laden';
      }
    }

    function renderSuggestions() {
      const container = document.getElementById('suggestions');
      container.innerHTML = '';
      if (!Array.isArray(suggestions) || !suggestions.length) {
        showStatus('Keine Vorschlaege erhalten.', true);
        return;
      }
      suggestions.forEach(function(s, i) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = (s && s.label) ? s.label : ('Option ' + (i + 1));
        chip.title = (s && s.text) ? s.text : '';
        chip.onclick = function() {
          showResult((s && s.text) ? s.text : '');
          showStatus('Vorschlag uebernommen — anpassen und einfuegen.', false);
        };
        container.appendChild(chip);
      });
      showStatus('Vorschlag anklicken — landet oben, dann einfuegen.', false);
    }

    async function generateReply(presetKeywords, langOverride) {
      const apiKey = getApiKey();
      if (!apiKey) return;

      const keywords = (presetKeywords !== undefined && presetKeywords !== null)
        ? presetKeywords
        : document.getElementById('keywords').value.trim();
      if (!keywords) { showStatus('Bitte Stichworte eingeben.', true); return; }
      lastPreset = (presetKeywords !== undefined && presetKeywords !== null) ? presetKeywords : null;
      lastLang = (langOverride === 'de' || langOverride === 'en') ? langOverride : null;

      const lang = (langOverride === 'de' || langOverride === 'en') ? langOverride : document.getElementById('lang').value;
      const tone = document.getElementById('tone').value;

      const toneDesc = {
        de: {
          formell: 'Formell und professionell, Sie-Form. Hoeflich aber nicht steif.',
          locker: 'Locker und direkt, Du-Form. Kurze Saetze, auf den Punkt.',
          kurz: 'Ultra-kurz, maximal 2-3 Saetze. Direkt und knapp.'
        },
        en: {
          formell: 'Formal and professional. Polite but not stiff.',
          locker: 'Casual and direct. Short sentences, to the point.',
          kurz: 'Ultra-short, max 2-3 sentences. Direct and concise.'
        }
      };
      // Gruss + Name: du -> Vorname, Sie -> voller Name
      const closing = {
        de: { formell: 'Viele Grüße\nRafael Groener', locker: 'Beste Grüße\nRafael', kurz: 'VG\nRafael Groener' },
        en: { formell: 'Kind regards\nRafael', locker: 'Best\nRafael', kurz: 'Best\nRafael' }
      };

      const btn = document.getElementById('generateBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>' + (lang === 'en' ? 'Generating...' : 'Generiere...');
      hideStatus();

      let prompt;
      if (mode === 'read') {
        prompt = (lang === 'en'
          ? 'You are an email assistant for Rafael Groener at LSJ Advisory (M&A boutique). Write a reply to the email below. Style: '
          : 'Du bist ein E-Mail-Assistent fuer Rafael Groener von LSJ Advisory (M&A Beratung). Schreibe eine Antwort auf die folgende E-Mail. Stil: ')
          + toneDesc[lang][tone] + '\n\n'
          + (lang === 'en' ? 'Original email from ' : 'Urspruengliche Mail von ') + mailData.from + ':\n'
          + (lang === 'en' ? 'Subject: ' : 'Betreff: ') + mailData.subject + '\n'
          + mailData.body + '\n\n'
          + (lang === 'en' ? "Rafael's key points for the reply: " : 'Rafaels Stichworte fuer die Antwort: ') + keywords;
      } else {
        prompt = (lang === 'en'
          ? 'You are an email assistant for Rafael Groener at LSJ Advisory (M&A boutique). Write a NEW email based on the key points below. Style: '
          : 'Du bist ein E-Mail-Assistent fuer Rafael Groener von LSJ Advisory (M&A Beratung). Verfasse eine NEUE E-Mail auf Basis der folgenden Stichworte. Stil: ')
          + toneDesc[lang][tone] + '\n\n'
          + (lang === 'en' ? "Rafael's key points: " : 'Rafaels Stichworte: ') + keywords;
      }

      // Zielsprache EXPLIZIT erzwingen (sonst spiegelt das Modell die Sprache der Originalmail)
      prompt += (lang === 'en')
        ? '\n\nIMPORTANT: Write the ENTIRE reply in English, regardless of the language of the original email.'
        : '\n\nWICHTIG: Schreibe die GESAMTE Antwort auf Deutsch, unabhaengig von der Sprache der Originalmail.';

      prompt += '\n\n' + (lang === 'en'
        ? 'Rules:\n- Write ONLY the email body, no subject line, no "Reply:" prefix\n- Start with a suitable salutation on its OWN line, then a BLANK line\n- Structure the body in 1-3 paragraphs with a BLANK line between paragraphs\n- Stick strictly to the key points, do not invent facts\n- No filler, straight to the point\n- End with exactly this closing formula AND the name on the next line (a BLANK line before the closing), and NOTHING after that (no contact block — a signature is added automatically):\n\n'
        : 'Regeln:\n- Schreibe NUR den Mailtext, keine Betreffzeile, kein "Antwort:" davor\n- Beginne mit einer passenden Anrede in EIGENER Zeile, dann LEERZEILE danach\n- Strukturiere den Hauptteil in 1-3 Absaetzen — zwischen Absaetzen IMMER eine LEERZEILE\n- Halte dich strikt an die Stichworte, erfinde nichts dazu\n- Kein Geschwafel, direkt auf den Punkt\n- Ende mit GENAU dieser Grussformel UND dem Namen in der naechsten Zeile (LEERZEILE vor der Grussformel) und NICHTS danach (keine Kontaktdaten — die Signatur wird automatisch angehaengt):\n\n')
        + closing[lang][tone]
        + '\n\n' + (lang === 'en'
          ? '- Use real line breaks, NO HTML tags'
          : '- Verwende echte Zeilenumbrueche, KEINE HTML-Tags\n- Verwende korrekte deutsche Rechtschreibung mit echten Umlauten: ü, ö, ä, ß. Schreibe NIEMALS ue/oe/ae/ss als Ersatz (z.B. "Grüße" nicht "Gruesse", "für" nicht "fuer", "können" nicht "koennen")');

      // Persoenliche Anrede nur beim Antworten (Empfaenger = Absender der Mail bekannt)
      if (mode === 'read') {
        const salutationRule = (lang === 'en')
          ? '\n- Salutation: begin with "Dear <first name>" using the sender name of the original email.'
          : (tone === 'locker'
              ? '\n- Anrede: persoenlich und per Du mit dem Vornamen des Absenders: "Lieber <Vorname>" bzw. "Liebe <Vorname>" je nach wahrscheinlichem Geschlecht.'
              : '\n- Anrede: persoenlich per Sie mit dem Namen des Absenders: "Lieber Herr <Nachname>" bzw. "Liebe Frau <Nachname>" je nach wahrscheinlichem Geschlecht.');
        prompt += salutationRule;
      }

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-5',
            max_tokens: 1024,
            messages: [{ role: 'user', content: prompt }]
          })
        });
        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || 'API Fehler: ' + response.status);
        }
        const data = await response.json();
        showResult(data.content[0].text);
        showStatus(lang === 'en' ? 'Reply generated — you can still edit the text above.' : 'Antwort generiert — du kannst den Text oben noch bearbeiten.', false);
      } catch (e) {
        showStatus('Fehler: ' + e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = mode === 'compose' ? 'Mail verfassen' : 'Antwort generieren';
      }
    }

    function regenerate() { generateReply(lastPreset, lastLang); }

    function showResult(text) {
      const box = document.getElementById('resultBox');
      box.textContent = text;
      box.classList.add('visible');
      document.getElementById('actions').classList.add('visible');
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function textToHtml(text) {
      const paragraphs = text.split(/\n\s*\n+/).map(p => p.trim()).filter(p => p);
      const style = 'font-family: Helvetica, Arial, sans-serif; font-size: 11pt; color: #000000;';
      const htmlParas = paragraphs.map(p => {
        const inner = p.split('\n').map(line => escapeHtml(line.trim())).join('<br>');
        return '<p style="margin: 0 0 11pt 0; ' + style + '">' + inner + '</p>';
      }).join('');
      return '<div style="' + style + '">' + htmlParas + '</div>';
    }

    function signatureHtml() {
      const sig = getSetting('mail_signature') || '';
      if (!sig.trim()) return '';
      const style = 'font-family: Helvetica, Arial, sans-serif; font-size: 11pt; color: #000000;';
      const lines = sig.split('\n').map(function(line) { return escapeHtml(line); }).join('<br>');
      return '<p style="margin: 11pt 0 0 0; ' + style + '">' + lines + '</p>';
    }

    function insertReply() {
      const reply = document.getElementById('resultBox').textContent;
      const item = Office.context.mailbox.item;

      if (mode === 'read') {
        // Lese-Modus: "Allen antworten" -> To + CC bleiben erhalten.
        // displayReplyAllForm ueberschreibt den Body samt automatischer Outlook-Signatur,
        // daher haengen wir die im Add-in hinterlegte Signatur (falls gesetzt) selbst an.
        const htmlBody = textToHtml(reply) + signatureHtml();
        try {
          item.displayReplyAllForm({ htmlBody: htmlBody });
          showStatus('In "Allen antworten" eingefuegt (CC bleibt erhalten)!', false);
        } catch (e) {
          copyFallback(reply);
        }
      } else {
        // Compose-Modus: an Cursorposition einfuegen. Die Outlook-Signatur ist bereits
        // im Entwurf und bleibt erhalten, daher hier KEINE Signatur anhaengen.
        const htmlBody = textToHtml(reply);
        item.body.setSelectedDataAsync(htmlBody, { coercionType: Office.CoercionType.Html }, function(res) {
          if (res.status === Office.AsyncResultStatus.Succeeded) {
            showStatus('In Mail eingefuegt!', false);
          } else {
            // Fallback: ganzen Body setzen
            item.body.setAsync(htmlBody, { coercionType: Office.CoercionType.Html }, function(r2) {
              if (r2.status === Office.AsyncResultStatus.Succeeded) { showStatus('In Mail eingefuegt!', false); }
              else { copyFallback(reply); }
            });
          }
        });
      }
    }

    function copyFallback(text) {
      navigator.clipboard.writeText(text).then(function() {
        showStatus('In Zwischenablage kopiert — Strg+V in der Mail.', false);
      }).catch(function() {
        showStatus('Einfuegen nicht moeglich — Text bitte manuell kopieren.', true);
      });
    }

    function showStatus(msg, isError) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status visible' + (isError ? ' error' : '');
    }
    function hideStatus() { document.getElementById('status').className = 'status'; }
  </script>
</body>
</html>
