# Besetzung des Hoerbuchs.
#
# Vier Rollen: pro Sprache eine Erzaehlstimme und eine "Feldstimme" fuer alle
# gesprochenen Beispielzeilen (Blockquotes, Scripts, Line Library).
#
# backend: piper | edge
#   piper - vollstaendig offline, Modelle liegen lokal (Apache-2.0 / MIT-Modelle)
#   edge  - Microsoft-Edge-Neuralstimmen, kostenlos und ohne API-Key, braucht
#           Internet zu speech.platform.bing.com

backend: piper

# ---------------------------------------------------------------- piper -----
piper:
  # Modelle werden von den sherpa-onnx-Releases geladen (Mirror der Piper-Voices)
  base_url: https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models
  sample_rate: 24000        # Zielrate nach Resampling
  # expressiveness   = Variation in Klangfarbe und Melodie (Piper-Standard 0.667)
  # rhythm_variation = Variation der Lautlaengen, also des Sprechrhythmus  (0.8)
  # Hoehere Werte klingen erzaehlt statt abgelesen; ueber ~0.95 wird es unruhig.
  cast:
    narrator_de:
      model: vits-piper-de_DE-thorsten-high     # maennlich, ruhig, 22,05 kHz
      speaker: 0
      speed: 1.04
      expressiveness: 0.80
      rhythm_variation: 0.92
      gain_db: 0.0
    voice_de:
      model: vits-piper-de_DE-thorsten_emotional-medium  # Sprecher 0 = amused
      speaker: 0
      speed: 1.0
      expressiveness: 0.88
      rhythm_variation: 0.95
      gain_db: 0.0
    narrator_en:
      model: vits-piper-en_US-lessac-high       # weiblich, US, 22,05 kHz
      speaker: 0
      speed: 1.0
      expressiveness: 0.72
      rhythm_variation: 0.85
      gain_db: 0.0
    voice_en:
      model: vits-piper-en_US-ryan-high         # maennlich, US, 22,05 kHz
      speaker: 0
      speed: 0.98
      expressiveness: 0.78
      rhythm_variation: 0.90
      gain_db: 0.0

  # Alternativen zum Durchtauschen (gleiche Quelle, gleiches Namensschema):
  #   deutsch  : vits-piper-de_DE-thorsten_emotional-medium (speaker 0=amused,
  #              4=neutral, 7=whisper), vits-piper-de_DE-kerstin-low (weiblich),
  #              vits-piper-de_DE-eva_k-x_low (weiblich), vits-piper-de_DE-ramona-low,
  #              vits-piper-de_DE-karlsson-low, vits-piper-de_DE-thorsten-medium
  #   englisch : vits-piper-en_US-amy-medium, vits-piper-en_GB-alba-medium,
  #              vits-piper-en_GB-cori-high, vits-piper-en_US-hfc_female-medium,
  #              vits-piper-en_US-joe-medium, vits-piper-en_US-libritts_r-medium

# ----------------------------------------------------------------- edge -----
# Multilinguale Neural-Stimmen. Klanglich deutlich naeher an einer
# Studioproduktion; identisch besetzbar, weil alle vier Deutsch UND Englisch
# koennen. Auflistung aller Stimmen: `edge-tts --list-voices`
edge:
  sample_rate: 24000
  cast:
    narrator_de:
      model: de-DE-FlorianMultilingualNeural    # maennlich, warm
      rate: "-4%"
      pitch: "-2Hz"
    voice_de:
      model: de-DE-SeraphinaMultilingualNeural  # weiblich, lebendig
      rate: "+0%"
      pitch: "+0Hz"
    narrator_en:
      model: en-US-AvaMultilingualNeural        # weiblich, ruhig
      rate: "-4%"
      pitch: "+0Hz"
    voice_en:
      model: en-US-AndrewMultilingualNeural     # maennlich, laessig
      rate: "+0%"
      pitch: "+0Hz"

# ------------------------------------------------------------- dramaturgie --
# Pausen in Millisekunden nach dem jeweiligen Blocktyp.
pauses:
  title: 1400
  subtitle: 700
  kicker: 350
  chapter: 900
  heading: 550
  subheading: 400
  para: 380
  item: 260
  pair: 260
  line: 620
  note: 500
# Zusaetzliche Pause VOR einem Block.
pauses_before:
  chapter: 1100
  heading: 500
  subheading: 300
  line: 260

# Zielpegel der Endmischung (EBU R128).
mastering:
  lufs: -18.0
  true_peak: -3.0
  lra: 11.0
  mp3_bitrate: 96k
  channels: 1

# Traegersaetze wie "Die Line lautet:" bei direkter Wiederholung ausduennen.
trim_repeated_carriers: true
